<div class="container mt-5">
    <div class="row">
        <div class="col-md-6">
            <div class="card">
                <div class="card-body">
                    <h3 class="">{{isInEditMode ? 'Update Todo' : 'Add Todo'}}</h3>
                    <div class="form-group">
                        <label for="todoName">Enter Todo Name</label>
                        <input type="text" class="form-control" #todoName>

                        <label for="isCompleted">Enter Status</label>
                        <select class="form-control" #isActive>
                            <option value="">select option</option>
                            <option value="yes">Yes</option>
                            <option value="no">No</option>
                        </select>
                    </div>

                    <div class="mt-3">
                        <button 
                        (click)="onAddTodo()"
                        *ngIf="!isInEditMode"
                        class="w-100" mat-raised-button color="primary">Add Todo</button>
                        <button 
                        (click)="onUpdateTodo()"
                        *ngIf="isInEditMode"
                        class="w-100" mat-raised-button color="warn">Update Todo</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-md-6">
            <div class="card">
                <div class="card-body">
                    <ul class="list-group" *ngIf="todosArr.length > 0 ; else noTodo">
                        <li class="list-group-item d-flex justify-content-between align-items-center" *ngFor="let todo of todosArr">
                            <div>
                                <input 
                                (click)="onChangeCheck(todo)"
                                [checked]="todo.isActive"
                                type="checkbox" class="p-2 mr-2">
                                <strong>{{todo.todoName}} <span 
                                    [ngClass]="{
                                        'badge-success' : todo.isActive,
                                        'badge-danger' : !todo.isActive
                                    }"
                                    class="badge p-2">{{todo.isActive ? 'Active' : 'Inactive'}}</span> </strong>
                            </div>
                            <div>
                                <button 
                                (click)="onEditTodo(todo)"
                                mat-mini-fab color="accent" class="mr-2">
                                    <mat-icon>edit</mat-icon>
                                </button>
                                <button 
                                (click)="onDeleteTodo(todo.todoId)"
                                mat-mini-fab color="primary">
                                    <mat-icon>delete</mat-icon>
                                </button>
                                
                            </div>
                        </li>
                    </ul>

                    <ng-template #noTodo>
                        <p class="alert alert-danger">No todo Added yet</p>
                    </ng-template>
                </div>
            </div>
        </div>
    </div>
</div>
